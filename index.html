<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Fire Emulator</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #15161a; color: #eee; display: flex; height: 100vh; }
    #sidebar { width: 240px; background: #1e1f25; padding: 16px; }
    #sidebar h1 { font-size: 20px; color: #ff6a1a; margin-top: 0; }
    .instance { padding: 8px; background: #2a2b33; border-radius: 6px; margin-bottom: 8px; }
    button { background: #ff6a1a; color: white; border: 0; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
    #main { flex: 1; display: flex; flex-direction: column; }
    #tabs { display: flex; background: #1e1f25; }
    .tab { padding: 12px 20px; cursor: pointer; }
    .tab.active { border-bottom: 3px solid #ff6a1a; }
    #content { flex: 1; padding: 20px; }
    textarea { width: 100%; height: 250px; background: #0e0f12; color: #7CFC00; border: 1px solid #333; font-family: monospace; padding: 10px; box-sizing: border-box; }
    .panel { display: none; }
    .panel.active { display: block; }
  </style>
</head>
<body>
  <div id="sidebar">
    <h1>🔥 Fire Emulator</h1>
    <div class="instance">Instance 1 (arrêtée)</div>
    <button>+ Nouvelle instance</button>
  </div>
  <div id="main">
    <div id="tabs">
      <div class="tab active" data-panel="screen">Écran</div>
      <div class="tab" data-panel="scripts">Scripts</div>
    </div>
    <div id="content">
      <div class="panel active" id="screen">L'écran Android s'affichera ici.</div>
      <div class="panel" id="scripts">
        <textarea>CLICK 500 300
WAIT 2
CLICK 700 450</textarea>
        <br><br><button>▶ Lancer le script</button>
      </div>
    </div>
  </div>
  <script>
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab, .panel').forEach(e => e.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.panel).classList.add('active');
      });
    });
  </script>
</body>
</html>
